name: 可复用多载体门禁校验工作流

on:
  workflow_call:
    inputs:
      run_spring_boot:
        description: 是否执行 Spring Boot 3 应用构建与容器门禁
        required: false
        type: boolean
        default: true
      run_vue3:
        description: 是否执行 Vue 3 应用构建与容器门禁
        required: false
        type: boolean
        default: true
      run_release_dryrun:
        description: 是否执行发版打包干跑与工作流边界校验
        required: false
        type: boolean
        default: false
      run_docs_only:
        description: 是否为纯文档变更模式（仅执行仓库基线与 ShellCheck 门禁）
        required: false
        type: boolean
        default: false
      app_version:
        description: 注入 Spring Boot 3 应用与容器构建的版本标识
        required: false
        type: string
        default: '0.1.0-ci'
      vue_app_version:
        description: 注入 Vue 3 应用与容器构建的版本标识（留空时回退至 app_version）
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  repo-baseline:
    name: 仓库基线与 ShellCheck 门禁
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 运行仓库级基线检查（LF / 权限 / 链接 / 凭据 / 术语）
        run: bash scripts/verify-repo.sh

      - name: 安装并运行 ShellCheck 检查全仓脚本
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          git ls-files '*.sh' | xargs -r shellcheck

  spring-boot-gate:
    name: Spring Boot 3 应用构建与容器门禁
    needs: repo-baseline
    if: ${{ !inputs.run_docs_only && inputs.run_spring_boot }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（Temurin）与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行 Spring Boot 3 参考应用单元测试与打包
        run: |
          mvn -B -ntp -f templates/spring-boot-jar/app/pom.xml test
          mvn -B -ntp -f templates/spring-boot-jar/app/pom.xml -DskipTests package "-Dapp.version=${{ inputs.app_version }}"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint 静态检查（quickstart Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/spring-boot-jar/deploy/docker/quickstart/Dockerfile

      - name: Hadolint 静态检查（production Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/spring-boot-jar/deploy/docker/production/Dockerfile

      - name: Hadolint 静态检查（hardened Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/spring-boot-jar/deploy/docker/hardened/Dockerfile

      - name: 真实构建并实测三级 Docker 与 Compose 容器契约
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: bash scripts/verify-containers.sh --stack spring-boot-jar

      - name: 安装 Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy 镜像安全扫描（输出 HIGH/CRITICAL 全表并阻断可修复 CRITICAL）
        run: |
          for tier in quickstart production hardened; do
            image="ghcr.io/atengk/deploy-templates/spring-boot-jar:${tier}"
            echo "::group::Trivy 漏洞扫描报告（HIGH,CRITICAL） - ${image}"
            trivy image --severity HIGH,CRITICAL "${image}" || true
            echo "::endgroup::"
            trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 "${image}"
          done

  vue3-gate:
    name: Vue 3 应用构建与容器门禁
    needs: repo-baseline
    if: ${{ !inputs.run_docs_only && inputs.run_vue3 }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 pnpm 11.21.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: 配置 Node.js 22 与 pnpm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: templates/vue3-pnpm/app/pnpm-lock.yaml

      - name: 安装依赖并运行 Vue 3 参考应用测试与构建
        env:
          VITE_APP_VERSION: ${{ inputs.vue_app_version || inputs.app_version }}
        run: |
          pnpm --dir templates/vue3-pnpm/app install --frozen-lockfile
          pnpm --dir templates/vue3-pnpm/app test
          pnpm --dir templates/vue3-pnpm/app build

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint 静态检查（quickstart Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/vue3-pnpm/deploy/docker/quickstart/Dockerfile

      - name: Hadolint 静态检查（production Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/vue3-pnpm/deploy/docker/production/Dockerfile

      - name: Hadolint 静态检查（hardened Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/vue3-pnpm/deploy/docker/hardened/Dockerfile

      - name: 真实构建并实测三级 Docker 与 Compose 容器契约
        env:
          APP_VERSION: ${{ inputs.vue_app_version || inputs.app_version }}
        run: bash scripts/verify-containers.sh --stack vue3-pnpm

      - name: 安装 Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: Trivy 镜像安全扫描（输出 HIGH/CRITICAL 全表并阻断可修复 CRITICAL）
        run: |
          for tier in quickstart production hardened; do
            image="ghcr.io/atengk/deploy-templates/vue3-pnpm:${tier}"
            echo "::group::Trivy 漏洞扫描报告（HIGH,CRITICAL） - ${image}"
            trivy image --severity HIGH,CRITICAL "${image}" || true
            echo "::endgroup::"
            trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 "${image}"
          done

  host-gate:
    name: 宿主机（systemd 与 Nginx）门禁
    needs: repo-baseline
    if: ${{ !inputs.run_docs_only && (inputs.run_spring_boot || inputs.run_vue3) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22（用于校验 Vue 3 运行时生成的 config.js）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Nginx 与 Java 21 运行时（供 systemd-analyze 与 nginx -t 校验）
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx openjdk-21-jre-headless

      - name: 准备系统上下文并校验 Spring Boot 3 systemd 服务单元
        if: ${{ inputs.run_spring_boot }}
        run: |
          if ! id springapp >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin springapp
          fi
          sudo mkdir -p /opt/spring-boot-jar/current /etc/spring-boot-jar
          sudo touch /opt/spring-boot-jar/current/app.jar
          sudo cp templates/spring-boot-jar/deploy/systemd/production/app.env.example /etc/spring-boot-jar/app.env
          sudo chmod 0640 /etc/spring-boot-jar/app.env
          for tier in quickstart production hardened; do
            echo "::group::systemd-analyze verify [${tier}]"
            sudo systemd-analyze verify "${PWD}/templates/spring-boot-jar/deploy/systemd/${tier}/spring-boot-jar.service"
            echo "::endgroup::"
          done

      - name: 按真实语法层级运行 nginx -t 校验全部 Nginx 配置
        run: |
          mkdir -p /tmp/nginx /tmp/nginx-test-body /tmp/nginx-test-proxy /tmp/nginx-test-fcgi /tmp/nginx-test-uwsgi /tmp/nginx-test-scgi
          for conf in \
            templates/spring-boot-jar/deploy/systemd/production/nginx.conf \
            templates/spring-boot-jar/deploy/systemd/hardened/nginx.conf \
            templates/vue3-pnpm/deploy/systemd/quickstart/nginx.conf \
            templates/vue3-pnpm/deploy/systemd/production/nginx.conf \
            templates/vue3-pnpm/deploy/systemd/hardened/nginx.conf \
            templates/vue3-pnpm/deploy/docker/quickstart/nginx.conf \
            templates/vue3-pnpm/deploy/docker/production/nginx.conf; do
            echo "::group::nginx -t [${conf}]"
            tmp_conf="$(mktemp)"
            cat > "${tmp_conf}" <<EOF
          pid /tmp/nginx-verify.pid;
          error_log /dev/stderr warn;
          events { worker_connections 64; }
          http {
            include /etc/nginx/mime.types;
            access_log off;
            client_body_temp_path /tmp/nginx-test-body;
            proxy_temp_path /tmp/nginx-test-proxy;
            fastcgi_temp_path /tmp/nginx-test-fcgi;
            uwsgi_temp_path /tmp/nginx-test-uwsgi;
            scgi_temp_path /tmp/nginx-test-scgi;
            include ${PWD}/${conf};
          }
          EOF
            sudo nginx -t -c "${tmp_conf}"
            rm -f "${tmp_conf}"
            echo "::endgroup::"
          done
          echo "::group::nginx -t [templates/vue3-pnpm/deploy/docker/hardened/nginx.conf]"
          sudo nginx -t -c "${PWD}/templates/vue3-pnpm/deploy/docker/hardened/nginx.conf"
          echo "::endgroup::"

      - name: 在隔离目录全链路演练宿主机发布、升级、回滚与健康检查
        run: |
          if [ "${{ inputs.run_spring_boot }}" = "true" ] && [ "${{ inputs.run_vue3 }}" = "true" ]; then
            bash scripts/verify-host.sh --stack all
          elif [ "${{ inputs.run_spring_boot }}" = "true" ]; then
            bash scripts/verify-host.sh --stack spring-boot-jar
          else
            bash scripts/verify-host.sh --stack vue3-pnpm
          fi

  kubernetes-gate:
    name: Kubernetes 清单渲染与安全审计门禁
    needs: repo-baseline
    if: ${{ !inputs.run_docs_only && (inputs.run_spring_boot || inputs.run_vue3) }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 kubectl v1.30.0
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: 安装 kubeconform CLI
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: 安装 Trivy CLI
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: 运行 Kubernetes 全量 Kustomize + kubeconform -strict + trivy config 门禁
        env:
          REQUIRE_ALL_TOOLS: 'true'
        run: |
          if [ "${{ inputs.run_spring_boot }}" = "true" ] && [ "${{ inputs.run_vue3 }}" = "true" ]; then
            bash scripts/verify-k8s.sh --stack all
          elif [ "${{ inputs.run_spring_boot }}" = "true" ]; then
            bash scripts/verify-k8s.sh --stack spring-boot-jar
          else
            bash scripts/verify-k8s.sh --stack vue3-pnpm
          fi

  release-dryrun:
    name: 发版打包干跑与工作流边界校验
    needs: repo-baseline
    if: ${{ !inputs.run_docs_only && inputs.run_release_dryrun }}
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 校验 CI、可复用校验与发版流水线触发边界、权限及脚本语法
        run: |
          if ! python3 -c "import yaml" >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3-yaml
          fi
          python3 - <<'PYEOF'
          import re
          import subprocess
          import yaml

          def load_wf(path):
              with open(path, "r", encoding="utf-8") as fh:
                  text = fh.read()
              data = yaml.safe_load(text)
              on_block = data.get("on", data.get(True))
              return text, data, on_block

          ci_text, ci_data, ci_on = load_wf(".github/workflows/ci.yml")
          assert isinstance(ci_on, dict) and set(ci_on.keys()) == {"pull_request", "push", "workflow_dispatch"}, f"ci.yml 触发器异常: {ci_on}"
          assert "tags" not in str(ci_on.get("push", {})), "ci.yml 严禁包含标签触发"
          assert ci_data.get("permissions") == {"contents": "read"}, f"ci.yml 权限异常: {ci_data.get('permissions')}"
          assert all("permissions" not in j for j in ci_data.get("jobs", {}).values()), "ci.yml 作业不应额外提权"
          assert ci_data["jobs"]["verify"]["uses"] == "./.github/workflows/verify.yml", "ci.yml 未复用 verify.yml"
          assert ("write" + "-all") not in ci_text

          vf_text, vf_data, vf_on = load_wf(".github/workflows/verify.yml")
          assert isinstance(vf_on, dict) and list(vf_on.keys()) == ["workflow_call"], f"verify.yml 仅允许 workflow_call: {vf_on}"
          assert vf_data.get("permissions") == {"contents": "read"}, f"verify.yml 权限异常: {vf_data.get('permissions')}"
          assert all("permissions" not in j for j in vf_data.get("jobs", {}).values()), "verify.yml 作业不应额外提权"
          assert ("write" + "-all") not in vf_text
          assert not any(("gh " + "release create") in step.get("run", "") for j in vf_data.get("jobs", {}).values() for step in j.get("steps", []))
          assert not any(step.get("with", {}).get("push") for j in vf_data.get("jobs", {}).values() for step in j.get("steps", []))

          rel_text, rel_data, rel_on = load_wf(".github/workflows/release.yml")
          assert isinstance(rel_on, dict) and list(rel_on.keys()) == ["push"], f"release.yml 非法触发器: {rel_on}"
          assert list(rel_on["push"].keys()) == ["tags"] and rel_on["push"]["tags"] == ["v*.*.*"], f"release.yml 非法 tags: {rel_on['push']}"
          assert rel_data.get("permissions") == {"contents": "read"}, f"release.yml 顶层权限异常: {rel_data.get('permissions')}"
          assert rel_data["jobs"]["verify"]["uses"] == "./.github/workflows/verify.yml", "release.yml 未复用 verify.yml"
          assert rel_data["jobs"]["publish-images"]["permissions"] == {"contents": "read", "packages": "write"}
          assert rel_data["jobs"]["create-release"]["permissions"] == {"contents": "write"}
          assert ("write" + "-all") not in rel_text and ("docker " + "save") not in rel_text

          expr_re = re.compile(r"\$\{\{.*?\}\}", re.DOTALL)
          for wf_path, wf_data in [("ci.yml", ci_data), ("verify.yml", vf_data), ("release.yml", rel_data)]:
              for job_id, job_cfg in wf_data.get("jobs", {}).items():
                  for step in job_cfg.get("steps", []):
                      if "run" not in step or step.get("shell", "bash") not in ("bash", "sh"):
                          continue
                      script = expr_re.sub("GH_EXPR_VALUE", step["run"])
                      subprocess.run(["bash", "-n"], input=script.encode("utf-8"), check=True)
          print("[PASS] ci.yml / verify.yml / release.yml 触发边界、权限与脚本语法校验通过")
          PYEOF

      - name: 配置 JDK 21（Temurin）与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 pnpm 11.21.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: 配置 Node.js 22 与 pnpm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: templates/vue3-pnpm/app/pnpm-lock.yaml

      - name: 离线干跑统一发版打包脚本并断言产物契约
        run: |
          DRYRUN_VER="v0.0.0-dryrun"
          DRYRUN_OUT="$(mktemp -d)"
          DRYRUN_VERIFY="$(mktemp -d)"
          trap 'rm -rf "${DRYRUN_OUT}" "${DRYRUN_VERIFY}"' EXIT

          bash scripts/package-release.sh --version "${DRYRUN_VER}" --output-dir "${DRYRUN_OUT}" --install-deps always

          for artifact in \
            "spring-boot-jar-${DRYRUN_VER}.jar" \
            "vue3-pnpm-dist-${DRYRUN_VER}.tar.gz" \
            "spring-boot-jar-systemd-${DRYRUN_VER}.tar.gz" \
            "vue3-pnpm-systemd-${DRYRUN_VER}.tar.gz" \
            "SHA256SUMS.txt"; do
            test -s "${DRYRUN_OUT}/${artifact}"
          done

          ! grep -q '/' "${DRYRUN_OUT}/SHA256SUMS.txt"
          (cd "${DRYRUN_OUT}" && sha256sum -c SHA256SUMS.txt)

          # 校验版本号已精确注入 Jar 与静态产物
          APP_YML="$(JAR_FILE="${DRYRUN_OUT}/spring-boot-jar-${DRYRUN_VER}.jar" python3 - <<'PYEOF'
          import os, zipfile
          with zipfile.ZipFile(os.environ["JAR_FILE"], "r") as zf:
              print(zf.read("BOOT-INF/classes/application.yml").decode("utf-8"))
          PYEOF
          )"
          ! grep -Fq '@app.version@' <<< "${APP_YML}"
          grep -Fq "${DRYRUN_VER}" <<< "${APP_YML}"

          mkdir -p "${DRYRUN_VERIFY}/vue-dist" "${DRYRUN_VERIFY}/sb-systemd" "${DRYRUN_VERIFY}/vue-systemd"
          tar -xzf "${DRYRUN_OUT}/vue3-pnpm-dist-${DRYRUN_VER}.tar.gz" -C "${DRYRUN_VERIFY}/vue-dist"
          test -s "${DRYRUN_VERIFY}/vue-dist/dist/index.html"
          grep -rFq "${DRYRUN_VER}" "${DRYRUN_VERIFY}/vue-dist/dist/assets"

          # 校验两栈宿主机即用部署归档结构完整（含 quickstart rollback.sh）
          tar -xzf "${DRYRUN_OUT}/spring-boot-jar-systemd-${DRYRUN_VER}.tar.gz" -C "${DRYRUN_VERIFY}/sb-systemd"
          test -s "${DRYRUN_VERIFY}/sb-systemd/spring-boot-jar-systemd-${DRYRUN_VER}/README.md"
          test -s "${DRYRUN_VERIFY}/sb-systemd/spring-boot-jar-systemd-${DRYRUN_VER}/app.jar"
          test -s "${DRYRUN_VERIFY}/sb-systemd/spring-boot-jar-systemd-${DRYRUN_VER}/deploy/systemd/quickstart/app.env.example"
          test -s "${DRYRUN_VERIFY}/sb-systemd/spring-boot-jar-systemd-${DRYRUN_VER}/deploy/systemd/quickstart/rollback.sh"
          test -s "${DRYRUN_VERIFY}/sb-systemd/spring-boot-jar-systemd-${DRYRUN_VER}/deploy/systemd/production/deploy.sh"
          test -s "${DRYRUN_VERIFY}/sb-systemd/spring-boot-jar-systemd-${DRYRUN_VER}/deploy/systemd/hardened/spring-boot-jar.service"

          tar -xzf "${DRYRUN_OUT}/vue3-pnpm-systemd-${DRYRUN_VER}.tar.gz" -C "${DRYRUN_VERIFY}/vue-systemd"
          test -s "${DRYRUN_VERIFY}/vue-systemd/vue3-pnpm-systemd-${DRYRUN_VER}/README.md"
          test -s "${DRYRUN_VERIFY}/vue-systemd/vue3-pnpm-systemd-${DRYRUN_VER}/dist/index.html"
          test -s "${DRYRUN_VERIFY}/vue-systemd/vue3-pnpm-systemd-${DRYRUN_VER}/deploy/systemd/quickstart/app.env.example"
          test -s "${DRYRUN_VERIFY}/vue-systemd/vue3-pnpm-systemd-${DRYRUN_VER}/deploy/systemd/quickstart/rollback.sh"
          test -s "${DRYRUN_VERIFY}/vue-systemd/vue3-pnpm-systemd-${DRYRUN_VER}/deploy/systemd/production/deploy.sh"
          test -s "${DRYRUN_VERIFY}/vue-systemd/vue3-pnpm-systemd-${DRYRUN_VER}/deploy/systemd/hardened/nginx.conf"

          # 复用唯一权威安全扫描函数，校验归档内不含真实 .env 文件或明文凭据
          # shellcheck source=scripts/lib/common.sh
          # shellcheck disable=SC1091
          source scripts/lib/common.sh
          verify_dir_clean_and_safe "${DRYRUN_VERIFY}" "发版干跑归档"

          # 校验打包过程未篡改工作区源码（如 pom.xml / package.json 版本）
          git diff --exit-code -- templates/spring-boot-jar/app/pom.xml templates/vue3-pnpm/app/package.json
          echo "[PASS] 发版打包干跑验证全部通过"
