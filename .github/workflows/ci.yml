name: 日常验证流水线（CI）

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 变更路径分流
    runs-on: ubuntu-24.04
    outputs:
      spring_boot: ${{ steps.compute.outputs.spring_boot }}
      vue3: ${{ steps.compute.outputs.vue3 }}
      release_dryrun: ${{ steps.compute.outputs.release_dryrun }}
      docs_only: ${{ steps.compute.outputs.docs_only }}
    steps:
      - name: 检出代码（用于路径变更过滤）
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 过滤受影响技术栈与公共验证脚本
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            spring_boot:
              - 'templates/spring-boot-jar/**'
              - '!templates/spring-boot-jar/**/*.md'
              - 'scripts/lib/common.sh'
              - 'scripts/verify-containers.sh'
              - 'scripts/verify-host.sh'
              - 'scripts/verify-k8s.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/verify.yml'
              - '.github/workflows/release.yml'
              - '.trivyignore'
            vue3:
              - 'templates/vue3-pnpm/**'
              - '!templates/vue3-pnpm/**/*.md'
              - 'scripts/lib/common.sh'
              - 'scripts/verify-containers.sh'
              - 'scripts/verify-host.sh'
              - 'scripts/verify-k8s.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/verify.yml'
              - '.github/workflows/release.yml'
              - '.trivyignore'
            release_dryrun:
              - 'templates/spring-boot-jar/**'
              - '!templates/spring-boot-jar/**/*.md'
              - 'templates/vue3-pnpm/**'
              - '!templates/vue3-pnpm/**/*.md'
              - 'scripts/lib/common.sh'
              - 'scripts/package-release.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/verify.yml'
              - '.github/workflows/release.yml'

      - name: 计算待执行门禁范围（手动触发全量执行，纯文档跳过耗时构建）
        id: compute
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sb="true"
            vue="true"
            rel="true"
          else
            sb="${{ steps.filter.outputs.spring_boot || 'false' }}"
            vue="${{ steps.filter.outputs.vue3 || 'false' }}"
            rel="${{ steps.filter.outputs.release_dryrun || 'false' }}"
          fi
          docs="false"
          if [ "${sb}" != "true" ] && [ "${vue}" != "true" ] && [ "${rel}" != "true" ]; then
            docs="true"
          fi
          {
            echo "spring_boot=${sb}"
            echo "vue3=${vue}"
            echo "release_dryrun=${rel}"
            echo "docs_only=${docs}"
          } >> "${GITHUB_OUTPUT}"

  verify:
    name: 多载体分级门禁校验
    needs: changes
    uses: ./.github/workflows/verify.yml
    with:
      run_spring_boot: ${{ needs.changes.outputs.spring_boot == 'true' }}
      run_vue3: ${{ needs.changes.outputs.vue3 == 'true' }}
      run_release_dryrun: ${{ needs.changes.outputs.release_dryrun == 'true' }}
      run_docs_only: ${{ needs.changes.outputs.docs_only == 'true' }}
      app_version: '0.1.0-ci'
      vue_app_version: '1.0.0-ci'
