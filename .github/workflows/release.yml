name: 标签触发发版流水线（Release）

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repo-baseline:
    name: 仓库基线与 ShellCheck 门禁
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 运行仓库级基线检查（LF / 权限 / 链接 / 凭据 / 术语）
        run: bash scripts/verify-repo.sh

      - name: 安装并运行 ShellCheck 检查全仓脚本
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          git ls-files '*.sh' | xargs -r shellcheck

  spring-boot-gate:
    name: Spring Boot 3 应用构建与容器门禁
    needs: repo-baseline
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（Temurin）与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 运行 Spring Boot 3 参考应用单元测试与打包
        run: |
          mvn -B -ntp -f templates/spring-boot-jar/app/pom.xml test
          mvn -B -ntp -f templates/spring-boot-jar/app/pom.xml -DskipTests package "-Dapp.version=${{ github.ref_name }}"

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint 静态检查（quickstart Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/spring-boot-jar/deploy/docker/quickstart/Dockerfile

      - name: Hadolint 静态检查（production Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/spring-boot-jar/deploy/docker/production/Dockerfile

      - name: Hadolint 静态检查（hardened Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/spring-boot-jar/deploy/docker/hardened/Dockerfile

      - name: 真实构建并实测三级 Docker 与 Compose 容器契约
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: bash scripts/verify-containers.sh --stack spring-boot-jar

      - name: 安装 Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Trivy 镜像安全扫描（输出 HIGH/CRITICAL 全表并阻断可修复 CRITICAL）
        run: |
          for tier in quickstart production hardened; do
            image="ghcr.io/atengk/deploy-templates/spring-boot-jar:${tier}"
            echo "::group::Trivy 漏洞扫描报告（HIGH,CRITICAL） - ${image}"
            trivy image --severity HIGH,CRITICAL "${image}" || true
            echo "::endgroup::"
            trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 "${image}"
          done

  vue3-gate:
    name: Vue 3 应用构建与容器门禁
    needs: repo-baseline
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 pnpm 11.21.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: 配置 Node.js 22 与 pnpm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: templates/vue3-pnpm/app/pnpm-lock.yaml

      - name: 安装依赖并运行 Vue 3 参考应用测试与构建
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
        run: |
          pnpm --dir templates/vue3-pnpm/app install --frozen-lockfile
          pnpm --dir templates/vue3-pnpm/app test
          pnpm --dir templates/vue3-pnpm/app build

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint 静态检查（quickstart Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/vue3-pnpm/deploy/docker/quickstart/Dockerfile

      - name: Hadolint 静态检查（production Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/vue3-pnpm/deploy/docker/production/Dockerfile

      - name: Hadolint 静态检查（hardened Dockerfile）
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: templates/vue3-pnpm/deploy/docker/hardened/Dockerfile

      - name: 真实构建并实测三级 Docker 与 Compose 容器契约
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: bash scripts/verify-containers.sh --stack vue3-pnpm

      - name: 安装 Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Trivy 镜像安全扫描（输出 HIGH/CRITICAL 全表并阻断可修复 CRITICAL）
        run: |
          for tier in quickstart production hardened; do
            image="ghcr.io/atengk/deploy-templates/vue3-pnpm:${tier}"
            echo "::group::Trivy 漏洞扫描报告（HIGH,CRITICAL） - ${image}"
            trivy image --severity HIGH,CRITICAL "${image}" || true
            echo "::endgroup::"
            trivy image --ignore-unfixed --severity CRITICAL --exit-code 1 "${image}"
          done

  host-gate:
    name: 宿主机（systemd 与 Nginx）门禁
    needs: repo-baseline
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 安装 Node.js 22（用于校验 Vue 3 运行时生成的 config.js）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 Nginx 与 Java 21 运行时（供 systemd-analyze 与 nginx -t 校验）
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx openjdk-21-jre-headless

      - name: 准备系统上下文并校验 Spring Boot 3 systemd 服务单元
        run: |
          if ! id springapp >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin springapp
          fi
          sudo mkdir -p /opt/spring-boot-jar/current /etc/spring-boot-jar
          sudo touch /opt/spring-boot-jar/current/app.jar
          sudo cp templates/spring-boot-jar/deploy/systemd/production/app.env.example /etc/spring-boot-jar/app.env
          sudo chmod 0640 /etc/spring-boot-jar/app.env
          for tier in quickstart production hardened; do
            echo "::group::systemd-analyze verify [${tier}]"
            sudo systemd-analyze verify "${PWD}/templates/spring-boot-jar/deploy/systemd/${tier}/spring-boot-jar.service"
            echo "::endgroup::"
          done

      - name: 按真实语法层级运行 nginx -t 校验全部 Nginx 配置
        run: |
          mkdir -p /tmp/nginx /tmp/nginx-test-body /tmp/nginx-test-proxy /tmp/nginx-test-fcgi /tmp/nginx-test-uwsgi /tmp/nginx-test-scgi
          for conf in \
            templates/spring-boot-jar/deploy/systemd/production/nginx.conf \
            templates/spring-boot-jar/deploy/systemd/hardened/nginx.conf \
            templates/vue3-pnpm/deploy/systemd/quickstart/nginx.conf \
            templates/vue3-pnpm/deploy/systemd/production/nginx.conf \
            templates/vue3-pnpm/deploy/systemd/hardened/nginx.conf \
            templates/vue3-pnpm/deploy/docker/quickstart/nginx.conf \
            templates/vue3-pnpm/deploy/docker/production/nginx.conf; do
            echo "::group::nginx -t [${conf}]"
            tmp_conf="$(mktemp)"
            cat > "${tmp_conf}" <<EOF
          pid /tmp/nginx-verify.pid;
          error_log /dev/stderr warn;
          events { worker_connections 64; }
          http {
            include /etc/nginx/mime.types;
            access_log off;
            client_body_temp_path /tmp/nginx-test-body;
            proxy_temp_path /tmp/nginx-test-proxy;
            fastcgi_temp_path /tmp/nginx-test-fcgi;
            uwsgi_temp_path /tmp/nginx-test-uwsgi;
            scgi_temp_path /tmp/nginx-test-scgi;
            include ${PWD}/${conf};
          }
          EOF
            sudo nginx -t -c "${tmp_conf}"
            rm -f "${tmp_conf}"
            echo "::endgroup::"
          done
          echo "::group::nginx -t [templates/vue3-pnpm/deploy/docker/hardened/nginx.conf]"
          sudo nginx -t -c "${PWD}/templates/vue3-pnpm/deploy/docker/hardened/nginx.conf"
          echo "::endgroup::"

      - name: 在隔离目录全链路演练宿主机发布、升级、回滚与健康检查
        run: bash scripts/verify-host.sh --stack all

  kubernetes-gate:
    name: Kubernetes 清单渲染与安全审计门禁
    needs: repo-baseline
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 kubectl v1.30.0
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0

      - name: 安装 kubeconform CLI
        run: |
          KUBECONFORM_VERSION="v0.6.7"
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: 安装 Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: 运行 Kubernetes 全量 Kustomize + kubeconform -strict + trivy config 门禁
        env:
          REQUIRE_ALL_TOOLS: 'true'
        run: bash scripts/verify-k8s.sh --stack all

  publish-images:
    name: 推送双架构 GHCR 镜像并生成 SBOM
    needs: [repo-baseline, spring-boot-gate, vue3-gate, host-gate, kubernetes-gate]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - stack: spring-boot-jar
            tier: quickstart
            context: templates/spring-boot-jar/app
            dockerfile: templates/spring-boot-jar/deploy/docker/quickstart/Dockerfile
          - stack: spring-boot-jar
            tier: production
            context: templates/spring-boot-jar/app
            dockerfile: templates/spring-boot-jar/deploy/docker/production/Dockerfile
          - stack: spring-boot-jar
            tier: hardened
            context: templates/spring-boot-jar/app
            dockerfile: templates/spring-boot-jar/deploy/docker/hardened/Dockerfile
          - stack: vue3-pnpm
            tier: quickstart
            context: templates/vue3-pnpm
            dockerfile: templates/vue3-pnpm/deploy/docker/quickstart/Dockerfile
          - stack: vue3-pnpm
            tier: production
            context: templates/vue3-pnpm
            dockerfile: templates/vue3-pnpm/deploy/docker/production/Dockerfile
          - stack: vue3-pnpm
            tier: hardened
            context: templates/vue3-pnpm
            dockerfile: templates/vue3-pnpm/deploy/docker/hardened/Dockerfile
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 QEMU 跨架构模拟
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 使用内置仓库令牌登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算 GHCR 镜像坐标与不可变/浮动标签
        id: meta
        run: |
          OWNER_LC="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          REPO_NAME="$(basename "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          IMAGE_REPO="ghcr.io/${OWNER_LC}/${REPO_NAME}/${{ matrix.stack }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          SEMVER_VERSION="${TAG_NAME#v}"
          IMMUTABLE_TAG="${SEMVER_VERSION}-${{ matrix.tier }}"
          FLOAT_TAG="${{ matrix.tier }}"

          TAGS="${IMAGE_REPO}:${IMMUTABLE_TAG},${IMAGE_REPO}:${FLOAT_TAG}"
          if [ "${{ matrix.tier }}" = "production" ]; then
            TAGS="${TAGS},${IMAGE_REPO}:latest"
          fi

          {
            echo "image_repo=${IMAGE_REPO}"
            echo "tag_name=${TAG_NAME}"
            echo "semver_version=${SEMVER_VERSION}"
            echo "immutable_tag=${IMMUTABLE_TAG}"
            echo "float_tag=${FLOAT_TAG}"
            echo "tags=${TAGS}"
          } >> "${GITHUB_OUTPUT}"

      - name: 跨编译构建并推送 linux/amd64 与 linux/arm64 双架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.stack }}-${{ matrix.tier }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.stack }}-${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.stack }}-${{ matrix.tier }}

      - name: 提取并校验多架构清单 Digest
        run: |
          DIGEST="${{ steps.build.outputs.digest }}"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "[ERROR] 提取多架构清单 Digest 失败或格式非法：${DIGEST}" >&2
            exit 1
          fi

          MANIFEST_RAW="$(docker buildx imagetools inspect --raw "${{ steps.meta.outputs.image_repo }}@${DIGEST}")"
          grep -Fq '"amd64"' <<< "${MANIFEST_RAW}"
          grep -Fq '"arm64"' <<< "${MANIFEST_RAW}"

          mkdir -p "${RUNNER_TEMP}/image-meta"
          HAS_LATEST="false"
          if [ "${{ matrix.tier }}" = "production" ]; then
            HAS_LATEST="true"
          fi

          cat > "${RUNNER_TEMP}/image-meta/${{ matrix.stack }}-${{ matrix.tier }}.json" <<EOF
          {
            "stack": "${{ matrix.stack }}",
            "tier": "${{ matrix.tier }}",
            "image_repo": "${{ steps.meta.outputs.image_repo }}",
            "immutable_tag": "${{ steps.meta.outputs.immutable_tag }}",
            "float_tag": "${{ steps.meta.outputs.float_tag }}",
            "has_latest": ${HAS_LATEST},
            "digest": "${DIGEST}"
          }
          EOF

      - name: 安装 Trivy CLI（用于生成 hardened 镜像 SBOM）
        if: matrix.tier == 'hardened'
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: 为 hardened 镜像生成 SPDX JSON 格式 SBOM
        if: matrix.tier == 'hardened'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${RUNNER_TEMP}/sbom"
          SBOM_FILE="${RUNNER_TEMP}/sbom/${{ matrix.stack }}-${{ github.ref_name }}-hardened.spdx.json"
          trivy image \
            --format spdx-json \
            --output "${SBOM_FILE}" \
            "${{ steps.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}"
          test -s "${SBOM_FILE}"
          python3 -c 'import json, sys; data = json.load(open(sys.argv[1], encoding="utf-8")); assert "spdxVersion" in data, "SBOM 缺少 spdxVersion"' "${SBOM_FILE}"

      - name: 上传镜像元数据切片
        uses: actions/upload-artifact@v4
        with:
          name: image-meta-${{ matrix.stack }}-${{ matrix.tier }}
          path: ${{ runner.temp }}/image-meta/${{ matrix.stack }}-${{ matrix.tier }}.json
          if-no-files-found: error

      - name: 上传 hardened 镜像 SPDX SBOM
        if: matrix.tier == 'hardened'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.stack }}
          path: ${{ runner.temp }}/sbom/${{ matrix.stack }}-${{ github.ref_name }}-hardened.spdx.json
          if-no-files-found: error

  create-release:
    name: 打包发版产物并创建 GitHub Release
    needs: publish-images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出仓库源码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（Temurin）与 Maven 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 安装 pnpm 11.21.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: 配置 Node.js 22 与 pnpm 缓存
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: templates/vue3-pnpm/app/pnpm-lock.yaml

      - name: 下载全部镜像元数据与 SBOM 制品
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/downloaded-artifacts

      - name: 构建发版产物、合流 SBOM 并生成校验清单
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_DIR="${RUNNER_TEMP}/release-artifacts"
          mkdir -p "${RELEASE_DIR}"

          cp "${RUNNER_TEMP}/downloaded-artifacts/sbom-spring-boot-jar/spring-boot-jar-${TAG_NAME}-hardened.spdx.json" "${RELEASE_DIR}/"
          cp "${RUNNER_TEMP}/downloaded-artifacts/sbom-vue3-pnpm/vue3-pnpm-${TAG_NAME}-hardened.spdx.json" "${RELEASE_DIR}/"

          bash scripts/package-release.sh \
            --version "${TAG_NAME}" \
            --output-dir "${RELEASE_DIR}" \
            --install-deps always \
            --skip-tests

          expected_files=(
            "spring-boot-jar-${TAG_NAME}.jar"
            "vue3-pnpm-dist-${TAG_NAME}.tar.gz"
            "spring-boot-jar-systemd-${TAG_NAME}.tar.gz"
            "vue3-pnpm-systemd-${TAG_NAME}.tar.gz"
            "spring-boot-jar-${TAG_NAME}-hardened.spdx.json"
            "vue3-pnpm-${TAG_NAME}-hardened.spdx.json"
            "SHA256SUMS.txt"
          )

          for f in "${expected_files[@]}"; do
            test -s "${RELEASE_DIR}/${f}"
          done

          actual_count="$(find "${RELEASE_DIR}" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          test "${actual_count}" -eq "${#expected_files[@]}"
          ! grep -q '/' "${RELEASE_DIR}/SHA256SUMS.txt"
          (cd "${RELEASE_DIR}" && sha256sum -c SHA256SUMS.txt)

      - name: 生成中文 Release Notes（含 6 个 GHCR 镜像坐标与 Digest）
        env:
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          META_ROOT: ${{ runner.temp }}/downloaded-artifacts
          NOTES_FILE: ${{ runner.temp }}/RELEASE_NOTES.md
        run: |
          python3 - <<'PYEOF'
          import glob
          import json
          import os

          tag_name = os.environ["TAG_NAME"]
          commit_sha = os.environ["COMMIT_SHA"]
          meta_root = os.environ["META_ROOT"]
          notes_file = os.environ["NOTES_FILE"]

          order = [
              ("spring-boot-jar", "quickstart"),
              ("spring-boot-jar", "production"),
              ("spring-boot-jar", "hardened"),
              ("vue3-pnpm", "quickstart"),
              ("vue3-pnpm", "production"),
              ("vue3-pnpm", "hardened"),
          ]

          records = {}
          for path in glob.glob(os.path.join(meta_root, "image-meta-*", "*.json")):
              with open(path, encoding="utf-8") as fh:
                  item = json.load(fh)
                  records[(item["stack"], item["tier"])] = item

          assert len(records) == 6, f"镜像元数据数量异常：{len(records)}"

          lines = [
              f"## {tag_name} 正式发版说明",
              "",
              f"- **版本标签**：`{tag_name}`",
              f"- **构建提交**：`{commit_sha}`",
              "- **架构支持**：`linux/amd64`、`linux/arm64`",
              "",
              "## GHCR 多架构容器镜像清单",
              "",
              "| 技术栈 | 交付等级 | 不可变镜像坐标 | 浮动标签 | 多架构清单 Digest |",
              "| :--- | :--- | :--- | :--- | :--- |",
          ]

          for key in order:
              item = records[key]
              immutable_ref = f"{item['image_repo']}:{item['immutable_tag']}"
              float_tags = f"`:{item['float_tag']}`"
              if item.get("has_latest"):
                  float_tags += "、`:latest`"
              lines.append(
                  f"| `{item['stack']}` | `{item['tier']}` | `{immutable_ref}` | {float_tags} | `{item['digest']}` |"
              )

          sb_hardened = records[("spring-boot-jar", "hardened")]
          vue_hardened = records[("vue3-pnpm", "hardened")]

          lines.extend([
              "",
              "### 使用不可变 Digest 拉取示例",
              "",
              "```bash",
              f"docker pull {sb_hardened['image_repo']}@{sb_hardened['digest']}",
              f"docker pull {vue_hardened['image_repo']}@{vue_hardened['digest']}",
              "```",
              "",
              "## 离线发版产物清单",
              "",
              "本 Release 仅上传离线应用产物、宿主机即用部署归档、SBOM 与校验清单（不包含容器镜像归档）：",
              "",
              "| 附件名称 | 说明 |",
              "| :--- | :--- |",
              f"| `spring-boot-jar-{tag_name}.jar` | 已注入版本 `{tag_name}` 的 Spring Boot 3 可执行 Jar |",
              f"| `vue3-pnpm-dist-{tag_name}.tar.gz` | 已注入版本 `{tag_name}` 的 Vue 3 纯静态编译产物（`dist/`） |",
              f"| `spring-boot-jar-systemd-{tag_name}.tar.gz` | Spring Boot 3 宿主机即用部署归档（含 `app.jar`、文档与三级 `systemd` 脚本/配置） |",
              f"| `vue3-pnpm-systemd-{tag_name}.tar.gz` | Vue 3 宿主机即用部署归档（含 `dist/`、文档与三级 Nginx/原子发布回滚脚本） |",
              f"| `spring-boot-jar-{tag_name}-hardened.spdx.json` | Spring Boot 3 企业加固级镜像 SPDX JSON 软件物料清单（SBOM） |",
              f"| `vue3-pnpm-{tag_name}-hardened.spdx.json` | Vue 3 企业加固级镜像 SPDX JSON 软件物料清单（SBOM） |",
              "| `SHA256SUMS.txt` | 覆盖上述全部 6 个附件的 SHA-256 校验和清单 |",
              "",
              "### 完整性校验命令",
              "",
              "```bash",
              "sha256sum -c SHA256SUMS.txt --ignore-missing",
              "```",
              "",
          ])

          with open(notes_file, "w", encoding="utf-8", newline="\n") as fh:
              fh.write("\n".join(lines))
          PYEOF

      - name: 发布 GitHub Release 并上传发版产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_DIR="${RUNNER_TEMP}/release-artifacts"
          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG_NAME}" \
            --notes-file "${RUNNER_TEMP}/RELEASE_NOTES.md" \
            --verify-tag \
            "${RELEASE_DIR}/spring-boot-jar-${TAG_NAME}.jar" \
            "${RELEASE_DIR}/vue3-pnpm-dist-${TAG_NAME}.tar.gz" \
            "${RELEASE_DIR}/spring-boot-jar-systemd-${TAG_NAME}.tar.gz" \
            "${RELEASE_DIR}/vue3-pnpm-systemd-${TAG_NAME}.tar.gz" \
            "${RELEASE_DIR}/spring-boot-jar-${TAG_NAME}-hardened.spdx.json" \
            "${RELEASE_DIR}/vue3-pnpm-${TAG_NAME}-hardened.spdx.json" \
            "${RELEASE_DIR}/SHA256SUMS.txt"
