# 生产级（production）宿主机 Nginx 站点配置
# 建议放置于 /etc/nginx/conf.d/vue3-pnpm.conf（与系统 nginx.service 配合使用）
# 注意：请勿启用 disable_symlinks on 或长缓存 open_file_cache，以确保 current 软链接切换即时生效
server {
  listen 80;
  server_name _;

  server_tokens off;
  root /opt/vue3-pnpm/current;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 健康检查端点，供负载均衡与宿主机探测脚本使用
  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 "ok\n";
  }

  # 运行时配置脚本端点：由 deploy.sh 写入当前版本目录并严格禁止浏览器缓存
  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # SPA 入口页禁止缓存，保证发布或回滚切换后浏览器及时拉取新资源哈希
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # 带内容哈希的静态构建资源启用长缓存，缺失资源直接返回 404
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri =404;
  }

  # SPA History 路由回退至入口页
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri $uri/ /index.html;
  }
}

