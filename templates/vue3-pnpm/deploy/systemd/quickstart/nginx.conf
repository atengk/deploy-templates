# 快速级（quickstart）宿主机 Nginx 站点配置
# 建议放置于 /etc/nginx/conf.d/vue3-pnpm.conf（与系统 nginx.service 配合使用）
server {
  listen 80;
  server_name _;

  # 指向由 deploy.sh 原子切换的当前激活版本目录软链接
  root /opt/vue3-pnpm/current;
  index index.html;

  # 基础健康检查端点
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA History 路由回退至入口页
  location / {
    try_files $uri $uri/ /index.html;
  }
}
