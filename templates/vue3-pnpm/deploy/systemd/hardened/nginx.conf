# 企业加固级（hardened）宿主机 Nginx 站点配置
# 建议放置于 /etc/nginx/conf.d/vue3-pnpm.conf（配合系统 nginx.service 与 systemd drop-in 只读沙箱使用）
# 注意：请勿启用 disable_symlinks on 或长缓存 open_file_cache，以确保 current 软链接切换即时生效
server {
  listen 80;
  server_name _;

  server_tokens off;
  root /opt/vue3-pnpm/current;
  index index.html;

  # 请求体大小与连接超时加固，缓解慢速连接与异常大报文消耗
  client_max_body_size 1m;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;
  keepalive_timeout 30s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 纯静态站点仅允许只读 HTTP 方法
  if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
  }

  # 禁止访问 .git、.env 等隐藏文件，仅放行 ACME 证书签发路径 /.well-known/
  location ~ /\.(?!well-known).* {
    access_log off;
    log_not_found off;
    return 404;
  }

  # 健康检查端点
  location = /healthz {
    access_log off;
    default_type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    return 200 "ok\n";
  }

  # 运行时配置脚本端点：由 deploy.sh 安全转义写入当前版本目录，严格禁止缓存并附加完整安全头
  location = /config.js {
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri =404;
  }

  # SPA 入口页禁止缓存并附加严格 CSP 与完整安全响应头
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  }

  # 带内容哈希的静态构建资源启用长缓存，缺失文件直接返回 404
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri =404;
  }

  # SPA History 路由回退至入口页并附加严格安全响应头
  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri $uri/ /index.html;
  }
}

# HTTPS / TLS 与限流参考占位：
# 1. 若需站点限流，请在主配置 /etc/nginx/nginx.conf 的 http {} 块内定义：
#    limit_req_zone $binary_remote_addr zone=vue3_static_limit:10m rate=30r/s;
#    再于本站点 server {} 块中启用：limit_req zone=vue3_static_limit burst=60 nodelay;
# 2. 启用 TLS 后建议在各响应块同步叠加 HSTS 响应头：
#    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
