# 生产级（production）Vue 3 SPA Docker Compose 独立副本
# 具备非特权端口 8080、运行时配置注入、健康检查、资源限额与日志滚动
services:
  app:
    image: ghcr.io/atengk/deploy-templates/vue3-pnpm:production
    build:
      context: ../../..
      dockerfile: deploy/docker/production/Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.io}
        PNPM_REGISTRY: ${PNPM_REGISTRY:-https://registry.npmjs.org}
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_TITLE: "${APP_TITLE:-Vue 3 参考应用（生产级）}"
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
      APP_ENV: ${APP_ENV:-production}
      APP_API_BASE_URL: ${APP_API_BASE_URL:-/api}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
