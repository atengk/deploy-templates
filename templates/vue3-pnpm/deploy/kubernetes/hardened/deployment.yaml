apiVersion: apps/v1
kind: Deployment
metadata:
  name: vue3-pnpm
  labels:
    app.kubernetes.io/name: vue3-pnpm
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: vue3-pnpm
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vue3-pnpm
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vue3-pnpm
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: vue3-pnpm
    spec:
      terminationGracePeriodSeconds: 30
      # 前端静态容器无需访问 Kubernetes API，禁用 ServiceAccount Token 自动挂载与多余服务链接环境变量
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Pod 级非 root 安全上下文：对齐 nginx-unprivileged 镜像的 UID/GID 101
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vue3-pnpm
          # 重要提示：上线前必须通过 kustomization.yaml 的 images 块锁定为不可变版本标签或 Digest（@sha256:...）
          image: ghcr.io/atengk/deploy-templates/vue3-pnpm:hardened
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vue3-pnpm-config
          # 容器级最小特权加固：禁止提权、启用只读根文件系统、移除全部 Linux Capabilities
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # 挂载可写 emptyDir 覆盖 /tmp，同时满足 /tmp/app-runtime/config.js 与 /tmp/nginx/* 临时路径写入需求
          volumeMounts:
            - name: tmp-runtime
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
      volumes:
        # 限制临时目录最大容量，防止异常写入耗尽宿主机临时存储
        - name: tmp-runtime
          emptyDir:
            sizeLimit: 64Mi
