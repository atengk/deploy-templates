apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-boot-jar-config
  labels:
    app.kubernetes.io/name: spring-boot-jar
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: spring-boot-jar
data:
  # 容器运行期时区配置（可按集群所在区域覆盖）
  TZ: "Asia/Shanghai"
  # 业务监听端口与独立管理端口隔离配置（8080 仅承载业务流量，8081 专供健康探针与 Prometheus 采集）
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "8081"
  # 内嵌 Tomcat 临时工作目录
  TOMCAT_BASEDIR: "/tmp/tomcat"
  # 容器内存感知 JVM 参数（配合 Deployment 512Mi 内存限额按需调整）
  JAVA_OPTS: "-XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom"
  # 应用元信息摘要（APP_VERSION 默认沿用构建期注入值，如需运行时覆盖可按需取消注释）
  APP_NAME: "spring-boot-jar-app"
  # APP_VERSION: "0.1.0"
  APP_ENV: "production"
  APP_MESSAGE: "Spring Boot 3 参考应用（生产级）"
  # 默认关闭 OTLP 导出；仅当配置有效 OpenTelemetry Collector HTTP 端点时启用（例如 http://otel-collector:4318）
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  # 单应用交付边界提示：外部数据库、缓存等敏感凭据请通过 Kubernetes Secret 注入，切勿明文写入 ConfigMap
