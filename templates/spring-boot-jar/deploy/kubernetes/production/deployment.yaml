apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-jar
  labels:
    app.kubernetes.io/name: spring-boot-jar
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: spring-boot-jar
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-jar
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-boot-jar
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: spring-boot-jar
    spec:
      # 配合 Spring Boot 20s 优雅停机宽限期与 5s preStop 摘除缓冲
      terminationGracePeriodSeconds: 30
      # Pod 级非 root 安全上下文：对齐 production Dockerfile 中的专用用户 UID/GID 10001
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spring-boot-jar
          image: ghcr.io/atengk/deploy-templates/spring-boot-jar:production
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: spring-boot-jar-config
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # 启动探针保护 Spring Boot + JVM 冷启动窗口（最长容忍约 65 秒）
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          # 就绪探针控制 Service Endpoints 摘除与业务流量切入
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # 存活探针仅监测应用内部存活性，避免外部依赖波动引发级联重启
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 停机前短暂缓冲，确保 kube-proxy / Ingress Controller 完成端点摘除后再接收 SIGTERM
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
