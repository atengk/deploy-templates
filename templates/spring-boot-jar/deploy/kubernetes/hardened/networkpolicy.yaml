apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spring-boot-jar
  labels:
    app.kubernetes.io/name: spring-boot-jar
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: spring-boot-jar
spec:
  # 精准作用于 spring-boot-jar Pod，实施入站与出站默认拒绝策略，仅放行最小必要端口
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-jar
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 1. 仅放行 Ingress Controller 所在命名空间访问业务端口 8080（禁止向入口控制器暴露 8081 管理端口）
    #    若集群将 ingress-nginx 安装在其他命名空间，请对应调整下方命名空间标签
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # 2. 按需放行监控命名空间访问独立管理端口 8081 的 Prometheus 指标端点
    #    若集群 Prometheus 部署在其他命名空间（如 observability），请同步调整下方命名空间标签
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # 默认仅最小放行集群内部 DNS 解析（53/UDP、53/TCP）
    # 若业务需访问外部数据库、缓存或 OpenTelemetry Collector（4318/TCP），请按单应用交付边界追加对应出站规则
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
