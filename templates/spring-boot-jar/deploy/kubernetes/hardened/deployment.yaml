apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-jar
  labels:
    app.kubernetes.io/name: spring-boot-jar
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: spring-boot-jar
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-jar
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-boot-jar
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: spring-boot-jar
      # 标准 Prometheus 基于 Pod 注解抓取配置（无需安装 Prometheus Operator CRD 即可开箱采集 8081 端口指标）
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # 配合 Spring Boot 20s 优雅停机宽限期；Distroless 无 shell，直接由 PID 1 JVM 响应 SIGTERM
      # 若集群为 Kubernetes 1.30+ 且需摘除缓冲，可按需启用原生 sleep preStop 动作：
      # lifecycle.preStop.sleep.seconds: 5
      terminationGracePeriodSeconds: 30
      # 应用无需访问 Kubernetes API，禁用 ServiceAccount Token 自动挂载与多余服务链接环境变量
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Pod 级非 root 安全上下文：精确对齐 Distroless java21-debian12:nonroot 镜像的 UID/GID 65532
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spring-boot-jar
          # 重要提示：上线前必须通过 kustomization.yaml 的 images 块锁定为不可变版本标签或 Digest（@sha256:...）
          image: ghcr.io/atengk/deploy-templates/spring-boot-jar:hardened
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: spring-boot-jar-config
          # 容器级最小特权加固：禁止提权、启用只读根文件系统、移除全部 Linux Capabilities
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          # 挂载可写 emptyDir 覆盖 /tmp，满足 -Djava.io.tmpdir=/tmp 与 TOMCAT_BASEDIR=/tmp/tomcat 写入需求
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          # 启动探针保护 Spring Boot + JVM 冷启动窗口（最长容忍约 65 秒）
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          # 就绪探针控制 Service Endpoints 摘除与业务流量切入
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          # 存活探针仅监测应用内部存活性，避免外部依赖波动引发级联重启
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        # 限制临时目录最大容量，防止异常写入耗尽节点临时存储
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
