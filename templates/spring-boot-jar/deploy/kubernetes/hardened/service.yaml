apiVersion: v1
kind: Service
metadata:
  name: spring-boot-jar
  labels:
    app.kubernetes.io/name: spring-boot-jar
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: spring-boot-jar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spring-boot-jar
    app.kubernetes.io/component: backend
  ports:
    # 默认仅暴露业务端口 8080，独立管理端口 8081 不纳入 Service 暴露面
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    # 若需启用可选 Prometheus Operator ServiceMonitor，可按需取消下方管理端口注释（严禁将其加入 Ingress 路由）：
    # - name: management
    #   port: 8081
    #   targetPort: management
    #   protocol: TCP
