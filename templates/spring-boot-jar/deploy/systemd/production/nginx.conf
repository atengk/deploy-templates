# Spring Boot 3 生产级（production）宿主机前置 Nginx 反向代理站点配置
# 建议安装路径：/etc/nginx/conf.d/spring-boot-jar.conf（或 Ubuntu/Debian 下 sites-available）

server {
  listen 80;
  # 生产环境请替换为实际业务域名，例如 app.example.com
  server_name _;

  server_tokens off;
  client_max_body_size 10m;

  # 显式屏蔽 Spring Boot Actuator 管理端点，禁止通过公网入口访问
  location ^~ /actuator {
    access_log off;
    return 404;
  }

  # 业务流量反向代理至本机 Spring Boot 8080 端口
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_hide_header X-Powered-By;
  }
}

