# Spring Boot 3 企业加固级（hardened）宿主机前置 Nginx 反向代理站点配置
# 建议安装路径：/etc/nginx/conf.d/spring-boot-jar.conf（或 Ubuntu/Debian 下 sites-available）

server {
  listen 80;
  # 生产环境请替换为实际业务域名，例如 app.example.com
  server_name _;

  server_tokens off;
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;

  # 拦截 TRACE/TRACK 等非标准危险 HTTP 方法
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
  }

  # 严格安全响应头（置于 server 级统一继承生效，避免各 location 重复声明遗漏）
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  # 启用 HTTPS 后建议取消注释开启 HSTS：
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # 显式屏蔽 Spring Boot Actuator 管理端点，禁止通过公网入口访问
  location ^~ /actuator {
    access_log off;
    return 404;
  }

  # 业务流量反向代理至本机回环端口 127.0.0.1:8080
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    proxy_hide_header X-Powered-By;
  }
}

