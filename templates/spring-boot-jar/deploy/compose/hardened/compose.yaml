# 企业加固级（hardened）Spring Boot 3 Docker Compose 独立副本
# 叠加 Distroless 非 root（65532）、只读根文件系统、/tmp 临时内存盘、全量裁剪 Capabilities、禁止提权与内置 JDK 健康探针
services:
  app:
    # 生产上线前建议锁定不可变版本标签（如 :<version>-hardened）或镜像 Digest（@sha256:...）
    image: ghcr.io/atengk/deploy-templates/spring-boot-jar:hardened
    build:
      context: ../../../app
      dockerfile: ../deploy/docker/hardened/Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.io}
        GCR_REGISTRY: ${GCR_REGISTRY:-gcr.io}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
        APP_VERSION: ${APP_VERSION:-0.1.0-SNAPSHOT}
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # 仅对外暴露业务端口，管理端口 8081 仅限容器内部 JDK 探针与内网隔离访问，严禁暴露至宿主机公网
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${SERVER_PORT:-8080}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      TOMCAT_BASEDIR: ${TOMCAT_BASEDIR:-/tmp/tomcat}
      APP_NAME: ${APP_NAME:-spring-boot-jar-app}
      APP_ENV: ${APP_ENV:-hardened}
      APP_MESSAGE: "${APP_MESSAGE:-Spring Boot 3 参考应用（企业加固级）}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      EXTERNAL_API_URL: ${EXTERNAL_API_URL:-}
    # Distroless 镜像无 shell 与 curl，显式复用内置零依赖 JDK 探针探测独立管理端口 readiness
    healthcheck:
      test: ["CMD", "java", "-Xms8m", "-Xmx32m", "-cp", "/app/app.jar", "com.ateng.deploy.HealthCheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
