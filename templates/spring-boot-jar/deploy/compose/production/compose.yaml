# 生产级（production）Spring Boot 3 Docker Compose 独立副本
# 具备非 root 运行（10001）、独立管理端口 8081 隔离、readiness 健康检查、资源限额、日志滚动与 30s 优雅停机宽限期
services:
  app:
    image: ghcr.io/atengk/deploy-templates/spring-boot-jar:production
    build:
      context: ../../../app
      dockerfile: ../deploy/docker/production/Dockerfile
      args:
        BASE_IMAGE_REGISTRY: ${BASE_IMAGE_REGISTRY:-docker.io}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
        APP_VERSION: ${APP_VERSION:-0.1.0-SNAPSHOT}
    restart: unless-stopped
    user: "10001:10001"
    ports:
      # 仅对外暴露业务端口，管理端口仅在容器内部用于探针与内网观测，严禁暴露至宿主机公网
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${SERVER_PORT:-8080}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      TOMCAT_BASEDIR: ${TOMCAT_BASEDIR:-/tmp/tomcat}
      JAVA_OPTS: "${JAVA_OPTS:--XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Djava.security.egd=file:/dev/./urandom}"
      APP_NAME: ${APP_NAME:-spring-boot-jar-app}
      APP_ENV: ${APP_ENV:-production}
      APP_MESSAGE: "${APP_MESSAGE:-Spring Boot 3 参考应用（生产级）}"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      EXTERNAL_API_URL: ${EXTERNAL_API_URL:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${MANAGEMENT_SERVER_PORT:-8081}/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
