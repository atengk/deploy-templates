spring:
  application:
    name: ${APP_NAME:spring-boot-jar-app}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    basedir: ${TOMCAT_BASEDIR:${java.io.tmpdir}/tomcat}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:false}
  otlp:
    tracing:
      export:
        enabled: false
    metrics:
      export:
        enabled: false
    logging:
      export:
        enabled: false

app:
  version: ${APP_VERSION:@app.version@}
  env: ${APP_ENV:default}
  message: ${APP_MESSAGE:Spring Boot 3 参考应用运行正常}
  external-api-url: ${EXTERNAL_API_URL:}
